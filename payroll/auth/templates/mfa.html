{% extends "base.html" %}
{% block title %}Verification code · DCI Payroll{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <div class="card-header bg-primary">Two-step verification</div>
    <div class="card-body">
      {% include "_messages.html" %}
      <p class="mb-3">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
      <form method="post" action="/login/mfa?next={{ next_path | urlencode }}" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_path }}">
        <div class="mb-3">
          <label class="form-label" for="code">Code</label>
          <input class="form-control" type="text" id="code" name="code" inputmode="text" autocomplete="one-time-code" required autofocus maxlength="32">
        </div>
        <button type="submit" class="btn btn-brand w-100">Verify</button>
      </form>
      <form method="post" action="/logout" class="mt-3 text-center">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-link btn-sm">Cancel and sign out</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
