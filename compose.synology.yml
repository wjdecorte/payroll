# Synology deployment. The database is NOT published on the host (internal network only).
# Reverse-proxy HTTPS (DSM Login Portal > Advanced > Reverse Proxy) to http://localhost:8070.
# The app port is bound to 127.0.0.1 only: plain-http LAN access to :8070 is intentionally impossible.
# ENCRYPTION_KEY is required (see docs/RUNBOOK.md); put it in a .env file next to this file.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll   # internal-only DB; change it (and DATABASE_URL below) per docs/RUNBOOK.md
      POSTGRES_DB: payroll
    volumes:
      # Bind mount so DB data lives in a visible Synology folder.
      # Back this up with Hyper Backup or DSM Snapshot Replication.
      - /volume1/docker/payroll/pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    # Image is built by GitHub Actions and pushed to GHCR on every push to master (after tests pass).
    image: ghcr.io/wjdecorte/payroll:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      # Host 8070 is the port the old UI was published on; the app listens on 9000 in the container.
      # Loopback only: reachable by the DSM reverse proxy (localhost:8070), not from the LAN.
      - "127.0.0.1:8070:9000"
    environment:
      DATABASE_URL: postgresql://payroll:payroll@db:5432/payroll
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (see docs/RUNBOOK.md)}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      WORKERS: 2
      API_LOG_TYPE: standard
      DEBUG_MODE: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/payroll/api/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Watchtower: auto-update containers when a new image is pushed ──
  # Checks GHCR every 5 minutes and restarts only the services labelled
  # com.centurylinklabs.watchtower.enable=true (api), leaving
  # the Postgres container alone.
  #
  # If the GHCR package is ever made private, mount a config.json with
  # credentials at /config.json:
  # {
  #   "auths": {
  #     "ghcr.io": { "auth": "<base64(username:PAT)>" }
  #   }
  # }
  # Generate base64: echo -n "username:ghp_yourtoken" | base64
  watchtower:
    image: nickfedor/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable
    restart: unless-stopped

networks:
  internal:
