services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll
    ports:
      - "5432:5432"
    volumes:
      # Bind mount so DB data lives in a visible Synology folder.
      # Back this up with Hyper Backup or DSM Snapshot Replication.
      - /volume1/docker/payroll/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    # Image is built by GitHub Actions and pushed to GHCR on every push to main.
    # Replace GITHUB_USERNAME with your GitHub username or org.
    image: ghcr.io/GITHUB_USERNAME/payroll:latest
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql://payroll:payroll@db:5432/payroll
      WORKERS: 2
      API_LOG_TYPE: standard
      DEBUG_MODE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/payroll/api/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/GITHUB_USERNAME/payroll:latest
    command: ["uvicorn", "payroll.frontend.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8070:8080"
    environment:
      API_BASE_URL: http://api:9000/payroll/api/v1
      FRONTEND_PORT: "8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional: Watchtower (auto-update containers when a new image is pushed) ──
  # Uncomment to enable. Watchtower checks GHCR every 5 minutes and restarts
  # any service whose image has a newer :latest tag.
  #
  # watchtower:
  #   image: containrrr/watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - /volume1/docker/payroll/watchtower-config.json:/config.json
  #   command: --interval 300 --cleanup
  #   restart: unless-stopped
  #
  # If your GHCR repo is private, create watchtower-config.json:
  # {
  #   "auths": {
  #     "ghcr.io": { "auth": "<base64(username:PAT)>" }
  #   }
  # }
  # Generate base64: echo -n "username:ghp_yourtoken" | base64
