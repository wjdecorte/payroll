# Local development stack. The database is NOT published on the host (internal network only).
# ENCRYPTION_KEY is required; generate one and export it before `docker compose up`:
#   export ENCRYPTION_KEY=$(python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())")
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql://payroll:payroll@db:5432/payroll
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (see .env.example for how to generate one)}
      # Plain-HTTP local dev needs a non-Secure cookie (true would break login over http);
      # production (HTTPS) must keep true.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      WORKERS: 2
      API_LOG_TYPE: standard
      DEBUG_MODE: "false"
      # Override QBO account names (ACCT_*) here if needed
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/payroll/api/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  internal:

volumes:
  pgdata:
