default_language_version:
  python: python3.14
default_stages: [pre-commit]
# Vendored third-party assets are kept byte-identical to upstream (checksums in
# payroll/frontend/static/vendor/README.md); whitespace fixers must not touch them.
exclude: ^payroll/frontend/static/vendor/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
