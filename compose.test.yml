# Throwaway Postgres for the test suite (host port 5433).
#   docker compose -f compose.test.yml up -d db
# Uses its own compose project name (payroll-test) so it never replaces or shares
# volumes with the dev stack in compose.yml; data lives only in tmpfs (no volume).
name: payroll-test

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll_test
    ports:
      - "5433:5432"
    command: postgres -c max_connections=200
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll_test"]
      interval: 2s
      timeout: 3s
      retries: 20
